
name: Build DroidWindows APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar paquetes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Descargar e instalar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Buscar ZIP de DroidWindows
        run: |
          echo "Buscando ZIP del proyecto..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" ! -iname "*gradle*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP de DroidWindows."
            echo "Archivos disponibles:"
            ls -la
            exit 1
          fi

          echo "ZIP seleccionado: $ZIP_FILE"
          echo "Contenido del ZIP:"
          unzip -l "$ZIP_FILE"

          mkdir -p project
          unzip -o -q "$ZIP_FILE" -d project

      - name: Localizar proyecto Android
        run: |
          echo "Buscando archivos Gradle del proyecto..."

          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle."
            echo "Contenido extraído:"
            find project -maxdepth 6 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar DroidWindows
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidWindows-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
