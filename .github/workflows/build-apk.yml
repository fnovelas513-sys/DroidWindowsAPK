
name: Build DroidWindows APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar paquetes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Buscar y descomprimir proyecto
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP en el repositorio."
            echo "Archivos disponibles:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "Contenido del ZIP:"
          unzip -l "$ZIP_FILE"

          unzip -o -q "$ZIP_FILE" -d project

          echo "Archivos extraídos:"
          find project -maxdepth 8 -type f | head -150

          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."
            echo "El ZIP podría no contener el proyecto Android completo."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidWindows-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
