name: Build DroidWindows APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q *.zip -d project

      - name: Find Gradle wrapper
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "No se encontró gradlew en el ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidWindows-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
